# ==============================================================================
# GitHub Actions Workflow: LSMS-ISA Cleaning Code Testing
#
# Jobs:
#   1. syntax-check – parse() all R scripts
#   2. test-cleaning – install packages, run all cleaning scripts dynamically
#
# Triggers:
#   - Push to main/develop branches
#   - Changes to R_scripts/Cleaning_code/, R_data/, or .github/workflows/
#   - Pull requests to main
#   - Manual workflow_dispatch
# ==============================================================================

name: LSMS-ISA Cleaning Code Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'R_scripts/Cleaning_code/**'
      - 'R_data/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'R_scripts/Cleaning_code/**'
      - 'R_data/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Syntax Check
  # --------------------------------------------------------------------------
  syntax-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R packages for syntax check
        run: |
          Rscript -e '
          install.packages(c("here", "stringr"), dependencies = TRUE)
          '

      - name: Parse R scripts
        run: |
          find R_scripts -name "*.R" -type f -print0 | while IFS= read -r -d '' file; do
            echo "Checking syntax: $file"
            Rscript -e "parse(file = '$file')"
            if [ $? -ne 0 ]; then
              echo "Syntax error in $file"
              exit 1
            fi
          done

  # --------------------------------------------------------------------------
  # JOB 2: Test Cleaning Scripts (Dynamic)
  # --------------------------------------------------------------------------
  test-cleaning:
    runs-on: ubuntu-22.04
    needs: syntax-check
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # --- INSTALL SYSTEM DEPENDENCIES ---
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libmagick++-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pandoc \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev
          sudo ldconfig

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e '
          # Core packages for cleaning scripts
          install.packages(c(
            "tidyverse",
            "haven",
            "labelled",
            "stringr",
            "purrr",
            "data.table",
            "lubridate",
            "mice",
            "psych",
            "stats",
            "here"
          ), dependencies = TRUE)
          
          # Additional packages for analysis and reporting
          install.packages(c(
            "broom",
            "car",
            "corrplot",
            "factoextra",
            "FactoMineR",
            "ggplot2",
            "gridExtra",
            "knitr",
            "markdown",
            "rmarkdown",
            "scales",
            "stargazer",
            "xtable",
            "forcats"
          ), dependencies = TRUE)
          '

      # --- RUN CLEANING SCRIPTS DYNAMICALLY ---
      - name: Find and run all cleaning scripts
        run: |
          cd R_scripts/Cleaning_code
          
          echo "=========================================="
          echo "Detecting R scripts in Cleaning_code/"
          echo "=========================================="
          
          # Find all R scripts, sort them
          scripts=$(find . -maxdepth 1 -name "*.R" -type f | sort)
          
          if [ -z "$scripts" ]; then
            echo "No R scripts found in Cleaning_code/"
            exit 0
          fi
          
          echo "Found scripts:"
          echo "$scripts" | sed 's/^/  - /'
          echo ""
          
          # Group scripts by country
          echo "=========================================="
          echo "Processing scripts by country"
          echo "=========================================="
          
          # Extract country codes from script names (e.g., NGA, MWI, TZA)
          countries=$(echo "$scripts" | grep -oE '^\./[A-Z]{3}_' | sed 's/^\.\///' | sed 's/_//' | sort -u)
          
          if [ -z "$countries" ]; then
            echo "No country codes detected in script names"
            echo "Running all scripts sequentially..."
            for script in $scripts; do
              echo ""
              echo ">>> Running: $script"
              Rscript --vanilla "$script"
              if [ $? -ne 0 ]; then
                echo "ERROR: $script failed"
                exit 1
              fi
              echo "<<< Completed: $script"
            done
          else
            # Run scripts country by country
            for country in $countries; do
              echo ""
              echo "=========================================="
              echo "Processing country: $country"
              echo "=========================================="
              
              country_scripts=$(echo "$scripts" | grep "^\./${country}_")
              if [ -z "$country_scripts" ]; then
                echo "No scripts found for $country"
                continue
              fi
              
              echo "Scripts for $country:"
              echo "$country_scripts" | sed 's/^/  - /'
              echo ""
              
              # Sort by wave (extract wave number from script name)
              # NGA_GHS2.R -> wave 2, NGA_GHS3.R -> wave 3, etc.
              sorted_scripts=$(echo "$country_scripts" | sort -t'_' -k2 -n)
              
              for script in $sorted_scripts; do
                echo ""
                echo ">>> Running: $script"
                Rscript --vanilla "$script"
                if [ $? -ne 0 ]; then
                  echo "ERROR: $script failed"
                  exit 1
                fi
                echo "<<< Completed: $script"
              done
              
              echo "=========================================="
              echo "Completed processing country: $country"
              echo "=========================================="
            done
          fi
          
          echo ""
          echo "=========================================="
          echo "All scripts completed successfully!"
          echo "=========================================="

      # --- UPLOAD OUTPUTS ---
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaning-outputs
          path: |
            R_data/Temp/
            R_data/Final/
            Output/
          retention-days: 14

      # --- COMMIT OUTPUTS BACK TO REPO ---
      - name: Commit outputs to repo
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.email "ci-bot@lsms-isa-panel.dev"
          git config user.name "CI Bot"
          git add -A R_data/Temp/ R_data/Final/ Output/ || true
          git diff --cached --quiet || git commit -m "ci: update cleaning outputs [skip ci]"
          git push origin ${{ github.ref_name }} --force-with-lease || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # JOB 3: Validation Summary
  # --------------------------------------------------------------------------
  validation-summary:
    runs-on: ubuntu-22.04
    needs: test-cleaning
    if: always() && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R packages for validation
        run: |
          Rscript -e '
          install.packages(c("tidyverse", "haven", "here"), dependencies = TRUE)
          '

      - name: Download outputs
        uses: actions/download-artifact@v4
        with:
          name: cleaning-outputs
          path: ./artifacts

      - name: Generate validation report
        run: |
          Rscript -e '
          library(tidyverse)
          library(haven)
          
          # Check if outputs exist
          output_dir <- "./artifacts"
          if (dir.exists(output_dir)) {
            final_dir <- file.path(output_dir, "R_data/Final")
            if (dir.exists(final_dir)) {
              files <- list.files(final_dir, pattern = "\\.dta$", full.names = TRUE)
              if (length(files) > 0) {
                cat("## Cleaning Scripts Validation Report\n\n")
                
                # Group by country
                countries <- unique(gsub("_.*", "", basename(files)))
                countries <- unique(gsub("NGA_.*", "NGA", countries))
                
                for (country in countries) {
                  country_files <- files[grepl(paste0("^", country), basename(files))]
                  if (length(country_files) > 0) {
                    cat(sprintf("### %s\n\n", country))
                    cat("| File | Rows | Columns | Level |\n")
                    cat("|------|------|---------|-------|\n")
                    for (f in country_files) {
                      tryCatch({
                        df <- read_dta(f)
                        n_rows <- nrow(df)
                        n_cols <- ncol(df)
                        level <- case_when(
                          grepl("hh", basename(f), ignore.case = TRUE) ~ "Household",
                          grepl("plot", basename(f), ignore.case = TRUE) ~ "Plot",
                          grepl("crop", basename(f), ignore.case = TRUE) ~ "Crop",
                          grepl("indiv", basename(f), ignore.case = TRUE) ~ "Individual",
                          TRUE ~ "Other"
                        )
                        cat(sprintf("| %s | %d | %d | %s |\n", 
                                    basename(f), n_rows, n_cols, level))
                      }, error = function(e) {
                        cat(sprintf("| %s | Error | - | - |\n", basename(f)))
                      })
                    }
                    cat("\n")
                  }
                }
                
              } else {
                cat("No .dta files found in output directory.\n")
              }
            } else {
              cat("Final directory not found.\n")
            }
          } else {
            cat("No artifacts downloaded.\n")
          }
          ' > validation_report.md

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.md
          retention-days: 30

# ==============================================================================
# END OF WORKFLOW
# ==============================================================================